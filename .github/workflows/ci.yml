name: CI

# git-flow: develop is the integration branch, release/* and hotfix/* carry a version, main holds releases.
on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Release branch must be SemVer and match the version
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          ver="${BRANCH#*/}"
          version=$(node -p "require('./package.json').version")
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "branch $BRANCH must be named <type>/MAJOR.MINOR.PATCH"; exit 1; fi
          if [ "$ver" != "$version" ]; then echo "branch $BRANCH does not match package version $version"; exit 1; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm audit --audit-level=high
