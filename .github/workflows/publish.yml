name: Publish

# Runs when `git flow release finish` / `git flow hotfix finish` pushes a bare SemVer tag (22.x.y) on main.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must be on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then echo "tag $TAG is not on main; release through git flow"; exit 1; fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag must match package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const v = require('./package.json').version; if (!/^\d+\.\d+\.\d+$/.test(process.env.TAG) || v !== process.env.TAG) { console.error('tag', process.env.TAG, 'does not match package version', v); process.exit(1) }"
      - run: npm run check
      # prepublishOnly re-runs the checks and prepack builds dist/.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
